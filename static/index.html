<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа №1</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <header class="header">
        <h1>Лабораторная работа №1</h1>
        <button id="themeToggle" class="theme-toggle">🌙</button>
        <div class="student-info">
            <span>ФИО: Пиляров Руслан Назирович</span>
            <span>Группа: P3219</span>
            <span>Вариант: 467088</span>
        </div>
    </header>

    <main class="main-content">
        <section class="card">
            <h2>Параметры точки</h2>
            <form id="pointForm">
                <div class="input-group">
                    <label>Координата X:</label>
                    <div class="x-buttons">
                        <button type="button" class="x-btn" data-value="-3">-3</button>
                        <button type="button" class="x-btn" data-value="-2">-2</button>
                        <button type="button" class="x-btn" data-value="-1">-1</button>
                        <button type="button" class="x-btn" data-value="0">0</button>
                        <button type="button" class="x-btn" data-value="1">1</button>
                        <button type="button" class="x-btn" data-value="2">2</button>
                        <button type="button" class="x-btn" data-value="3">3</button>
                        <button type="button" class="x-btn" data-value="4">4</button>
                        <button type="button" class="x-btn" data-value="5">5</button>
                    </div>
                    <input type="hidden" id="x-input" name="x">
                </div>

                <div class="input-group">
                    <label for="y-input">Координата Y (-5 до 5):</label>
                    <input type="text" id="y-input" name="y" placeholder="Введите Y">
                    <span id="y-error" class="error"></span>
                </div>

                <div class="input-group">
                    <label>Радиус R:</label>
                    <div class="r-buttons">
                        <label><input type="radio" name="r" value="1"> 1</label>
                        <label><input type="radio" name="r" value="1.5"> 1.5</label>
                        <label><input type="radio" name="r" value="2"> 2</label>
                        <label><input type="radio" name="r" value="2.5"> 2.5</label>
                        <label><input type="radio" name="r" value="3"> 3</label>
                    </div>
                </div>

                <div class="current-point">
                    Текущая точка: <span id="currentPoint">X: —, Y: —, R: —</span>
                </div>

                <button type="submit" class="submit-btn">Проверить точку</button>
            </form>
        </section>

        <section class="card">
            <h2>График области</h2>
            <canvas id="coordinatePlane" width="400" height="400"></canvas>
        </section>

        <section class="card">
            <h2>Результаты</h2>
            <div class="results-controls">
                <button id="clearAll" class="clear-btn">Очистить все</button>
                <button id="clearSelected" class="clear-btn">Удалить выбранные</button>
                <label><input type="checkbox" id="selectAll"> Выбрать все</label>
            </div>
            <div id="results" class="results-table"></div>
        </section>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
